<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b0e17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pasti</title>
<style>
:root{--bg:#0b0e17;--card:#151a29;--fg:#eef1f8;--mut:#8791ab;--acc:#4f8cff;--red:#ef4444;--grn:#22c55e;--ylw:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
h1{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:480px;width:100%;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:18px}
.timer{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sub{color:var(--mut);text-align:center;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:8px;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:1.5px solid #2a3150;background:transparent;color:var(--fg);border-radius:12px;padding:12px 0;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{width:100%;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:700;color:#fff;background:var(--acc)}
.btn.red{background:var(--red)}.btn.grn{background:var(--grn)}
.btn.ghost{background:transparent;border:1.5px solid #2a3150;color:var(--fg);font-weight:600}
.stop{width:120px;height:120px;border-radius:50%;margin:0 auto;display:block;border:0;background:var(--red);position:relative}
.stop::after{content:"";position:absolute;inset:38px;background:#fff;border-radius:8px}
.row{display:flex;flex-direction:column;gap:10px}
.big{font-size:22px;font-weight:700;text-align:center}
.ok{color:var(--grn)}.warn{color:var(--ylw)}.err{color:var(--red)}
.name{font-family:ui-monospace,Menlo,monospace;font-size:14px;text-align:center;color:var(--mut);word-break:break-all}
.small{font-size:12.5px;color:var(--mut);text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>🍽️ Pasti</h1>
<main id="app"></main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
